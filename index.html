<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donnington Grove Green Book</title>
  <style>
    :root {
      --bg-color: #12181b;
      --card-bg: #1e262c;
      --accent-color: #2ecc71;
      --text-color: #f5f6fa;
      --text-muted: #a4b0be;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px 10px;
      overflow-x: hidden;
    }

    /* Top Navigation Header */
    header {
      width: 100%;
      max-width: 800px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      margin-bottom: 20px;
    }

    .title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent-color);
    }

    .menu-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    label {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    select {
      background-color: var(--bg-color);
      color: var(--text-color);
      border: 1px solid var(--accent-color);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      cursor: pointer;
    }

    /* Flipbook Main Container */
    .book-wrapper {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 680px;
      perspective: 1500px;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: pan-y; /* Allows vertical scrolling while intercepting horizontal swipes */
    }

    .flipbook {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
    }

    .page {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      backface-visibility: hidden;
      transform-origin: left center;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1), z-index 0.6s;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    .page.flipped {
      transform: rotateY(-180deg);
      pointer-events: none;
    }

    .page-image-container {
      position: relative;
      width: 100%;
      height: 85%;
      background: #000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .page-image-container img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      transition: transform 0.3s ease;
      pointer-events: none; /* Prevents default image drag interference with swipe gestures */
    }

    .page-info {
      height: 15%;
      background: #182026;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid #2a353f;
      padding: 0 15px;
    }

    .info-box {
      text-align: center;
    }

    .info-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .info-value {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--accent-color);
    }

    /* Controls Bottom */
    .controls {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-top: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      background: var(--card-bg);
      color: var(--text-color);
      border: 1px solid #33414d;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: var(--accent-color);
      color: #12181b;
    }

    .btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .page-counter {
      font-size: 0.95rem;
      color: var(--text-muted);
      min-width: 120px;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <div class="title">Donnington Grove Green Book</div>
    <div class="menu-container">
      <label for="holeSelect">Jump to:</label>
      <select id="holeSelect" onchange="jumpToHole(parseInt(this.value))">
        <!-- Hole options dynamically generated -->
      </select>
    </div>
  </header>

  <div class="book-wrapper" id="bookWrapper">
    <div class="flipbook" id="flipbook">
      <!-- Pages dynamically inserted -->
    </div>
  </div>

  <div class="controls">
    <button class="btn" id="prevBtn" onclick="prevPage()">‹ Prev</button>
    <span class="page-counter" id="pageCounter">Hole 1 of 18</span>
    <button class="btn" id="nextBtn" onclick="nextPage()">Next ›</button>
    <button class="btn" id="rotateBtn">Rotate Image 90° ↻</button>
  </div>

  <script>
    // Full 18 Hole Data configuration
    const holeData = [
      // Front 9 Placeholders
      { hole: 1,  par: 4, hdcp: 10, image: 'hole1.jpg', rotation: 0 },
      { hole: 2,  par: 4, hdcp: 4,  image: 'hole2.jpg', rotation: 0 },
      { hole: 3,  par: 3, hdcp: 16, image: 'hole3.jpg', rotation: 0 },
      { hole: 4,  par: 5, hdcp: 2,  image: 'hole4.jpg', rotation: 0 },
      { hole: 5,  par: 4, hdcp: 8,  image: 'hole5.jpg', rotation: 0 },
      { hole: 6,  par: 3, hdcp: 18, image: 'hole6.jpg', rotation: 0 },
      { hole: 7,  par: 4, hdcp: 12, image: 'hole7.jpg', rotation: 0 },
      { hole: 8,  par: 5, hdcp: 6,  image: 'hole8.jpg', rotation: 0 },

      // Hole 9 + Back 9
      { hole: 9,  par: 4, hdcp: 14, image: 'd6c0f1f1-09e5-4ee1-af2e-25ca16731298-1_all_23241.jpg', rotation: 0 },
      { hole: 10, par: 5, hdcp: 5,  image: 'd6c0f1f1-09e5-4ee1-af2e-25ca16731298-1_all_23244.jpg', rotation: 0 },
      { hole: 11, par: 4, hdcp: 1,  image: 'd6c0f1f1-09e5-4ee1-af2e-25ca16731298-1_all_23245.jpg', rotation: 0 },
      { hole: 12, par: 4, hdcp: 13, image: 'd6c0f1f1-09e5-4ee1-af2e-25ca16731298-1_all_23246.jpg', rotation: 0 },
      { hole: 13, par: 5, hdcp: 7,  image: 'd6c0f1f1-09e5-4ee1-af2e-25ca16731298-1_all_23247.jpg', rotation: 0 },
      { hole: 14, par: 4, hdcp: 17, image: 'd6c0f1f1-09e5-4ee1-af2e-25ca16731298-1_all_23248.jpg', rotation: 0 },
      { hole: 15, par: 3, hdcp: 15, image: 'd6c0f1f1-09e5-4ee1-af2e-25ca16731298-1_all_23249.jpg', rotation: 0 },
      { hole: 16, par: 4, hdcp: 3,  image: 'd6c0f1f1-09e5-4ee1-af2e-25ca16731298-1_all_23250.jpg', rotation: 0 },
      { hole: 17, par: 3, hdcp: 9,  image: 'd6c0f1f1-09e5-4ee1-af2e-25ca16731298-1_all_23251.jpg', rotation: 0 },
      { hole: 18, par: 4, hdcp: 11, image: 'd6c0f1f1-09e5-4ee1-af2e-25ca16731298-1_all_23252.jpg', rotation: 0 }
    ];

    let currentIndex = 0;
    const flipbook = document.getElementById('flipbook');
    const bookWrapper = document.getElementById('bookWrapper');
    const selectMenu = document.getElementById('holeSelect');
    const pageCounter = document.getElementById('pageCounter');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const rotateBtn = document.getElementById('rotateBtn');

    function initFlipbook() {
      flipbook.innerHTML = '';
      selectMenu.innerHTML = '';

      holeData.forEach((item, index) => {
        // Build Select Option
        const option = document.createElement('option');
        option.value = index;
        option.textContent = `Hole ${item.hole} (Par ${item.par})`;
        selectMenu.appendChild(option);

        // Build Page Element
        const page = document.createElement('div');
        page.className = 'page';
        page.id = `page-${index}`;
        page.style.zIndex = holeData.length - index;

        page.innerHTML = `
          <div class="page-image-container">
            <img src="${item.image}" alt="Hole ${item.hole} Contour Map">
          </div>
          <div class="page-info">
            <div class="info-box">
              <div class="info-label">Hole</div>
              <div class="info-value">${item.hole}</div>
            </div>
            <div class="info-box">
              <div class="info-label">Par</div>
              <div class="info-value">${item.par}</div>
            </div>
            <div class="info-box">
              <div class="info-label">Handicap</div>
              <div class="info-value">${item.hdcp}</div>
            </div>
          </div>
        `;
        flipbook.appendChild(page);
      });

      updateUI();
    }

    function updateUI() {
      selectMenu.value = currentIndex;
      pageCounter.textContent = `Hole ${holeData[currentIndex].hole} of 18`;
      prevBtn.disabled = currentIndex === 0;
      nextBtn.disabled = currentIndex === holeData.length - 1;

      // Update page flip transforms and rotation states
      holeData.forEach((item, index) => {
        const page = document.getElementById(`page-${index}`);
        const imgElement = page.querySelector('.page-image-container img');
        imgElement.style.transform = `rotate(${item.rotation}deg)`;

        if (index < currentIndex) {
          page.classList.add('flipped');
        } else {
          page.classList.remove('flipped');
        }
      });
    }

    function nextPage() {
      if (currentIndex < holeData.length - 1) {
        currentIndex++;
        updateUI();
      }
    }

    function prevPage() {
      if (currentIndex > 0) {
        currentIndex--;
        updateUI();
      }
    }

    function jumpToHole(index) {
      currentIndex = index;
      updateUI();
    }

    function rotateCurrentImage() {
      const pageData = holeData[currentIndex];
      pageData.rotation = (pageData.rotation + 90) % 360;

      const imgElement = document.getElementById(`page-${currentIndex}`).querySelector('.page-image-container img');
      imgElement.style.transform = `rotate(${pageData.rotation}deg)`;
    }

    rotateBtn.addEventListener('click', rotateCurrentImage);

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') nextPage();
      if (e.key === 'ArrowLeft') prevPage();
      if (e.key === 'r' || e.key === 'R') rotateCurrentImage();
    });

    // Touch Swipe Navigation Logic
    let touchStartX = 0;
    let touchEndX = 0;
    const swipeThreshold = 40; // minimum pixels moved to trigger a page flip

    bookWrapper.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    bookWrapper.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      handleSwipe();
    }, { passive: true });

    function handleSwipe() {
      const swipeDistance = touchEndX - touchStartX;
      if (Math.abs(swipeDistance) >= swipeThreshold) {
        if (swipeDistance < 0) {
          // Flicked Left -> Move Next
          nextPage();
        } else {
          // Flicked Right -> Move Prev
          prevPage();
        }
      }
    }

    initFlipbook();
  </script>
</body>
</html>
