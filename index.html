<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Donnington Grove Green Book</title>
  
  <style>
    :root {
      --bg-dark: #070a0d;
      --glass-bg: rgba(14, 20, 26, 0.78);
      --glass-border: rgba(255, 255, 255, 0.12);
      --accent: #2ecc71;
      --accent-glow: rgba(46, 204, 113, 0.35);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --white-tee: #ffffff;
      --yellow-tee: #f1c40f;
      --red-tee: #e74c3c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: none; /* Prevent browser native scrolling/zooming */
    }

    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: var(--text-main);
      user-select: none;
      -webkit-user-select: none;
      position: fixed;
      touch-action: none;
    }

    #app-viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #111820 0%, #050709 100%);
      touch-action: none;
    }

    .stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      touch-action: none;
    }

    .map-container {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      transform-origin: center center;
      will-change: transform;
      transition: opacity 0.25s ease;
      touch-action: none;
    }

    .map-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      filter: drop-shadow(0 12px 30px rgba(0, 0, 0, 0.7));
      touch-action: none;
    }

    header.hud-header {
      position: absolute;
      top: max(10px, env(safe-area-inset-top));
      left: 10px;
      right: 10px;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      pointer-events: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-logo {
      width: 22px;
      height: 22px;
      fill: var(--accent);
    }

    .brand-title {
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .brand-title span {
      color: var(--accent);
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    select.hole-picker {
      background: rgba(0, 0, 0, 0.5);
      color: var(--accent);
      border: 1px solid var(--glass-border);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      outline: none;
      cursor: pointer;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      min-width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.9rem;
    }

    .icon-btn:active {
      background: var(--accent);
      color: #070a0d;
      border-color: var(--accent);
      transform: scale(0.95);
    }

    .hud-zoom-bar {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 50;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      padding: 6px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      pointer-events: auto;
    }

    .zoom-text {
      font-size: 0.65rem;
      font-weight: 800;
      color: var(--accent);
      text-align: center;
      padding: 2px 0;
    }

    footer.hud-scorecard {
      position: absolute;
      bottom: max(10px, env(safe-area-inset-bottom));
      left: 10px;
      right: 10px;
      z-index: 50;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: auto;
    }

    .scorecard-ribbon {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }

    .nav-btn:active:not(:disabled) {
      background: var(--accent);
      color: #070a0d;
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .nav-btn:disabled {
      opacity: 0.25;
      cursor: not-allowed;
    }

    .metrics-group {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .metric-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .metric-label {
      font-size: 0.58rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .metric-value {
      font-size: 0.95rem;
      font-weight: 900;
      color: var(--text-main);
      line-height: 1.1;
    }

    .metric-value.accent {
      color: var(--accent);
    }

    .nine-tag {
      font-size: 0.6rem;
      background: rgba(46, 204, 113, 0.15);
      color: var(--accent);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 800;
      text-transform: uppercase;
    }

    /* Tee Yardages Row */
    .tees-row {
      display: flex;
      align-items: center;
      justify-content: space-around;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 4px 8px;
    }

    .tee-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.75rem;
      font-weight: 800;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .dot-white { background-color: var(--white-tee); box-shadow: 0 0 4px #fff; }
    .dot-yellow { background-color: var(--yellow-tee); box-shadow: 0 0 4px var(--yellow-tee); }
    .dot-red { background-color: var(--red-tee); box-shadow: 0 0 4px var(--red-tee); }

    .val-white { color: var(--white-tee); }
    .val-yellow { color: var(--yellow-tee); }
    .val-red { color: var(--red-tee); }

    .spinner {
      position: absolute;
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      z-index: 10;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-card {
      position: absolute;
      z-index: 20;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      padding: 20px;
      border-radius: 16px;
      text-align: center;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
  </style>
</head>
<body>

  <div id="app-viewport">
    
    <!-- Floating Header HUD -->
    <header class="hud-header">
      <div class="brand">
        <svg class="brand-logo" viewBox="0 0 24 24">
          <path d="M19.38 3.55a1 1 0 0 0-1.13.23l-5.63 6.18V2a1 1 0 0 0-2 0v16.17a4 4 0 1 0 2 0V11.8l5.88-6.45a1 1 0 0 0-.12-1.8zM12 21a2 2 0 1 1 2-2 2 2 0 0 1-2 2z"/>
        </svg>
        <div class="brand-title">DG <span>Green Book</span></div>
      </div>
      <div class="header-controls">
        <select class="hole-picker" id="holePicker" onchange="jumpToHole(parseInt(this.value))"></select>
        <button class="icon-btn" onclick="toggleFullscreen()" title="Toggle Fullscreen">⛶</button>
      </div>
    </header>

    <!-- Edge-to-Edge Map Stage -->
    <main class="stage" id="stage">
      <div class="spinner" id="loadingSpinner"></div>
      <div class="map-container" id="mapContainer">
        <img id="mapImg" src="" alt="Golf Hole Green Map" />
      </div>
    </main>

    <!-- Floating Zoom Toolbar HUD -->
    <div class="hud-zoom-bar">
      <button class="icon-btn" onclick="modifyZoom(0.4)" title="Zoom In">+</button>
      <div class="zoom-text" id="zoomVal">1.0x</div>
      <button class="icon-btn" onclick="modifyZoom(-0.4)" title="Zoom Out">-</button>
      <button class="icon-btn" onclick="resetTransform()" title="Reset Zoom">1x</button>
      <button class="icon-btn" onclick="rotateMap()" title="Rotate 90 Degrees">↻</button>
    </div>

    <!-- Floating Scorecard Ribbon HUD -->
    <footer class="hud-scorecard">
      
      <!-- Yardages Row -->
      <div class="tees-row">
        <div class="tee-pill">
          <span class="dot dot-white"></span>
          <span class="val-white" id="whiteYards">381y</span>
        </div>
        <div class="tee-pill">
          <span class="dot dot-yellow"></span>
          <span class="val-yellow" id="yellowYards">373y</span>
        </div>
        <div class="tee-pill">
          <span class="dot dot-red"></span>
          <span class="val-red" id="redYards">332y</span>
        </div>
      </div>

      <!-- Navigation & Metrics Row -->
      <div class="scorecard-ribbon">
        <button class="nav-btn" id="prevBtn" onclick="prevHole()">
          ‹ Prev
        </button>

        <div class="metrics-group">
          <div class="metric-item">
            <span class="metric-label">Hole</span>
            <span class="metric-value accent" id="holeNum">1</span>
          </div>
          <div class="nine-tag" id="nineTag">Front 9</div>
          <div class="metric-item">
            <span class="metric-label">Par</span>
            <span class="metric-value" id="parNum">4</span>
          </div>
          <div class="metric-item">
            <span class="metric-label">S.I.</span>
            <span class="metric-value" id="siNum">10</span>
          </div>
        </div>

        <button class="nav-btn" id="nextBtn" onclick="nextHole()">
          Next ›
        </button>
      </div>

    </footer>

  </div>

  <script>
    // Exact official Donnington Grove 18-Hole Scorecard Data and verified Direct Image URLs
    const holeData = [
      { hole: 1,  par: 4, si: 10, white: 381, yellow: 373, red: 332, img: 'https://i.postimg.cc/FKjcHcJM/DG1.jpg' },
      { hole: 2,  par: 5, si: 8,  white: 583, yellow: 511, red: 487, img: 'https://i.postimg.cc/XJ45GJw2/DG2.jpg' },
      { hole: 3,  par: 4, si: 12, white: 411, yellow: 389, red: 348, img: 'https://i.postimg.cc/xdKH1HzD/DG3.jpg' },
      { hole: 4,  par: 4, si: 2,  white: 444, yellow: 422, red: 355, img: 'https://i.postimg.cc/BvxDnDKW/DG4.jpg' },
      { hole: 5,  par: 3, si: 16, white: 198, yellow: 168, red: 141, img: 'https://i.postimg.cc/V6mtr6jZ/DG5.jpg' },
      { hole: 6,  par: 5, si: 6,  white: 559, yellow: 550, red: 438, img: 'https://i.postimg.cc/76wzG6gW/DG6.jpg' },
      { hole: 7,  par: 3, si: 18, white: 188, yellow: 155, red: 118, img: 'https://i.postimg.cc/hjcmzj9w/DG7.jpg' },
      { hole: 8,  par: 4, si: 4,  white: 463, yellow: 441, red: 391, img: 'https://i.postimg.cc/qR4KhR8S/DG8.jpg' },
      { hole: 9,  par: 4, si: 14, white: 329, yellow: 317, red: 289, img: 'https://i.postimg.cc/qR4KhR8P/DG9.jpg' },
      { hole: 10, par: 5, si: 5,  white: 624, yellow: 567, red: 498, img: 'https://i.postimg.cc/1tsFntGh/DG10.jpg' },
      { hole: 11, par: 4, si: 1,  white: 423, yellow: 382, red: 333, img: 'https://i.postimg.cc/FRNSdRyQ/DG11.jpg' },
      { hole: 12, par: 4, si: 13, white: 378, yellow: 366, red: 338, img: 'https://i.postimg.cc/cH03gHRS/DG12.jpg' },
      { hole: 13, par: 5, si: 7,  white: 523, yellow: 502, red: 481, img: 'https://i.postimg.cc/4dsc7d6X/DG13.jpg' },
      { hole: 14, par: 4, si: 17, white: 368, yellow: 310, red: 270, img: 'https://i.postimg.cc/d1wCk12q/DG14.jpg' },
      { hole: 15, par: 3, si: 15, white: 179, yellow: 161, red: 114, img: 'https://i.postimg.cc/ydsRgdm1/DG15.jpg' },
      { hole: 16, par: 4, si: 3,  white: 427, yellow: 405, red: 376, img: 'https://i.postimg.cc/gJmhXJVc/DG16.jpg' },
      { hole: 17, par: 3, si: 9,  white: 210, yellow: 186, red: 165, img: 'https://i.postimg.cc/50bzY0BN/DG17.jpg' },
      { hole: 18, par: 4, si: 11, white: 420, yellow: 371, red: 361, img: 'https://i.postimg.cc/PxTDpxWx/DG18.jpg' }
    ];

    // State Management
    let currentHoleIndex = 0;
    const holeStates = holeData.map(() => ({
      rotation: 0,
      scale: 1.0,
      panX: 0,
      panY: 0
    }));

    // DOM Elements
    const stage = document.getElementById('stage');
    const mapContainer = document.getElementById('mapContainer');
    const mapImg = document.getElementById('mapImg');
    const loadingSpinner = document.getElementById('loadingSpinner');
    const holePicker = document.getElementById('holePicker');
    const zoomVal = document.getElementById('zoomVal');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    
    // Scorecard DOM
    const holeNum = document.getElementById('holeNum');
    const parNum = document.getElementById('parNum');
    const siNum = document.getElementById('siNum');
    const nineTag = document.getElementById('nineTag');
    const whiteYards = document.getElementById('whiteYards');
    const yellowYards = document.getElementById('yellowYards');
    const redYards = document.getElementById('redYards');

    function initApp() {
      // Populate Dropdown
      holePicker.innerHTML = holeData.map((h, i) => `<option value="${i}">Hole ${h.hole}</option>`).join('');

      // Image loading handlers
      mapImg.onload = () => {
        loadingSpinner.style.display = 'none';
        mapContainer.style.opacity = '1';
        renderTransform();
      };

      mapImg.onerror = () => {
        loadingSpinner.style.display = 'none';
        const errCard = document.createElement('div');
        errCard.className = 'error-card';
        errCard.id = 'errCard';
        errCard.innerHTML = `
          <div>Failed to load Hole ${holeData[currentHoleIndex].hole} green map.</div>
          <button class="nav-btn" onclick="loadHole(${currentHoleIndex})">Retry</button>
        `;
        stage.appendChild(errCard);
      };

      loadHole(0);
      bindTouchAndGestureListeners();
      bindKeyboardShortcuts();
    }

    function loadHole(index) {
      const errCard = document.getElementById('errCard');
      if (errCard) errCard.remove();

      currentHoleIndex = index;
      const data = holeData[index];

      mapContainer.style.opacity = '0';
      loadingSpinner.style.display = 'block';

      // Update Header & Ribbon HUD
      holePicker.value = index;
      holeNum.textContent = data.hole;
      parNum.textContent = data.par;
      siNum.textContent = data.si;
      nineTag.textContent = data.hole <= 9 ? 'Front 9' : 'Back 9';
      whiteYards.textContent = `${data.white}y`;
      yellowYards.textContent = `${data.yellow}y`;
      redYards.textContent = `${data.red}y`;

      prevBtn.disabled = index === 0;
      nextBtn.disabled = index === holeData.length - 1;

      mapImg.src = data.img;
      renderTransform();
    }

    function renderTransform() {
      const state = holeStates[currentHoleIndex];
      const stageRect = stage.getBoundingClientRect();
      const sW = stageRect.width || window.innerWidth;
      const sH = stageRect.height || window.innerHeight;

      // Smart rotation aspect autoScale logic:
      // When rotated by 90deg or 270deg, inverse scale ensures full edge-to-edge fitting without clipping
      let autoScale = 1.0;
      if (state.rotation % 180 !== 0) {
        autoScale = Math.min(sW / sH, sH / sW);
      }

      const totalScale = state.scale * autoScale;
      mapContainer.style.transform = `translate(${state.panX}px, ${state.panY}px) rotate(${state.rotation}deg) scale(${totalScale})`;
      zoomVal.textContent = `${state.scale.toFixed(1)}x`;
    }

    function modifyZoom(delta) {
      const state = holeStates[currentHoleIndex];
      state.scale = Math.max(1.0, Math.min(4.0, state.scale + delta));
      if (state.scale === 1.0) {
        state.panX = 0;
        state.panY = 0;
      }
      renderTransform();
    }

    function resetTransform() {
      const state = holeStates[currentHoleIndex];
      state.scale = 1.0;
      state.panX = 0;
      state.panY = 0;
      renderTransform();
    }

    function rotateMap() {
      const state = holeStates[currentHoleIndex];
      state.rotation = (state.rotation + 90) % 360;
      renderTransform();
    }

    function jumpToHole(index) {
      if (index >= 0 && index < holeData.length) loadHole(index);
    }

    function prevHole() {
      if (currentHoleIndex > 0) loadHole(currentHoleIndex - 1);
    }

    function nextHole() {
      if (currentHoleIndex < holeData.length - 1) loadHole(currentHoleIndex + 1);
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    }

    function bindTouchAndGestureListeners() {
      let isDragging = false;
      let startX = 0, startY = 0;
      let initialPanX = 0, initialPanY = 0;
      let initialPinchDist = 0;
      let initialScale = 1.0;
      let lastTapTime = 0;
      let touchMode = 'NONE';
      let pinchCenterX = 0, pinchCenterY = 0;

      // Mouse Dragging (Desktop Fallback)
      stage.addEventListener('mousedown', (e) => {
        if (e.target.closest('header, footer, .hud-zoom-bar')) return;
        const state = holeStates[currentHoleIndex];
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        initialPanX = state.panX;
        initialPanY = state.panY;
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const state = holeStates[currentHoleIndex];
        state.panX = initialPanX + (e.clientX - startX);
        state.panY = initialPanY + (e.clientY - startY);
        renderTransform();
      });

      window.addEventListener('mouseup', () => { isDragging = false; });

      // Native Multi-Touch Pinch, Drag, & Swipe Logic for Android/iOS
      stage.addEventListener('touchstart', (e) => {
        if (e.target.closest('header, footer, .hud-zoom-bar')) return;

        if (e.touches.length > 1 && e.cancelable) {
          e.preventDefault();
        }

        const state = holeStates[currentHoleIndex];
        const now = Date.now();

        if (e.touches.length === 1) {
          // Double-Tap Zoom Toggle Detection
          if (now - lastTapTime < 300) {
            if (state.scale > 1.2) {
              resetTransform();
            } else {
              state.scale = 2.5;
              renderTransform();
            }
            lastTapTime = 0;
            touchMode = 'NONE';
            return;
          }
          lastTapTime = now;

          touchMode = 'PAN';
          isDragging = true;
          startX = e.touches[0].clientX;
          startY = e.touches[0].clientY;
          initialPanX = state.panX;
          initialPanY = state.panY;

        } else if (e.touches.length === 2) {
          touchMode = 'PINCH';
          isDragging = false;

          const t1 = e.touches[0];
          const t2 = e.touches[1];

          initialPinchDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
          initialScale = state.scale;
          pinchCenterX = (t1.clientX + t2.clientX) / 2;
          pinchCenterY = (t1.clientY + t2.clientY) / 2;
          initialPanX = state.panX;
          initialPanY = state.panY;
        }
      }, { passive: false });

      stage.addEventListener('touchmove', (e) => {
        if (e.target.closest('header, footer, .hud-zoom-bar')) return;
        if (e.cancelable) e.preventDefault();

        const state = holeStates[currentHoleIndex];

        if (e.touches.length === 1 && touchMode === 'PAN' && isDragging) {
          const deltaX = e.touches[0].clientX - startX;
          const deltaY = e.touches[0].clientY - startY;

          if (state.scale > 1.05) {
            state.panX = initialPanX + deltaX;
            state.panY = initialPanY + deltaY;
            renderTransform();
          }
        } else if (e.touches.length === 2 && touchMode === 'PINCH' && initialPinchDist > 0) {
          const t1 = e.touches[0];
          const t2 = e.touches[1];
          const currentDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);

          if (currentDist > 10) {
            const ratio = currentDist / initialPinchDist;
            state.scale = Math.max(1.0, Math.min(5.0, initialScale * ratio));

            // Pan centered on initial pinch point
            const currentMidX = (t1.clientX + t2.clientX) / 2;
            const currentMidY = (t1.clientY + t2.clientY) / 2;
            state.panX = initialPanX + (currentMidX - pinchCenterX);
            state.panY = initialPanY + (currentMidY - pinchCenterY);

            renderTransform();
          }
        }
      }, { passive: false });

      stage.addEventListener('touchend', (e) => {
        const state = holeStates[currentHoleIndex];

        if (touchMode === 'PAN' && isDragging && e.changedTouches.length === 1) {
          const deltaX = e.changedTouches[0].clientX - startX;
          const deltaY = e.changedTouches[0].clientY - startY;

          // Single finger swipe at 1x scale changes hole
          if (state.scale <= 1.05 && Math.abs(deltaX) > 50 && Math.abs(deltaX) > Math.abs(deltaY) * 1.5) {
            if (deltaX < 0) nextHole();
            else prevHole();
          }
        }

        if (e.touches.length === 0) {
          touchMode = 'NONE';
          isDragging = false;
          initialPinchDist = 0;
        } else if (e.touches.length === 1) {
          touchMode = 'PAN';
          startX = e.touches[0].clientX;
          startY = e.touches[0].clientY;
          initialPanX = state.panX;
          initialPanY = state.panY;
        }
      }, { passive: true });
    }

    function bindKeyboardShortcuts() {
      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') nextHole();
        if (e.key === 'ArrowLeft') prevHole();
        if (e.key === 'r' || e.key === 'R') rotateMap();
        if (e.key === '+' || e.key === '=') modifyZoom(0.4);
        if (e.key === '-' || e.key === '_') modifyZoom(-0.4);
        if (e.key === '0') resetTransform();
      });

      window.addEventListener('resize', renderTransform);
    }

    window.onload = initApp;
  </script>
</body>
</html>
